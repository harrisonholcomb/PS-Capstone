<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="title desc">
  <title id="title">Shared Space automatic recognition user flow</title>
  <desc id="desc">A centered box and arrow flow from a sink state change through sensor detection and automatic identity matching to recognition posted. If no roommate cleans, the alert stays open.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173a37" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#718b82"/>
    </marker>
    <style>
      .label{font:700 15px Arial,sans-serif;letter-spacing:2.2px;fill:#237568}
      .title{font:700 27px Arial,sans-serif;fill:#173a37}
      .subtitle{font:400 20px Arial,sans-serif;fill:#61736d}
      .node-title{font:700 20px Arial,sans-serif;fill:#173a37;text-anchor:middle}
      .node-label{font:700 12px Arial,sans-serif;letter-spacing:1.8px;fill:#237568;text-anchor:middle}
      .small{font:400 14px Arial,sans-serif;fill:#61736d;text-anchor:middle}
      .branch{font:700 12px Arial,sans-serif;letter-spacing:1.4px;fill:#237568}
      .key{font:600 13px Arial,sans-serif;fill:#536760}
    </style>
  </defs>

  <rect width="1800" height="720" rx="32" fill="#f5f1e7"/>
  <rect x="34" y="34" width="1732" height="652" rx="24" fill="#e4ece5" stroke="#b7c7bc" stroke-width="2"/>

  <text class="label" x="90" y="100">ONE USER FLOW</text>
  <text class="title" x="90" y="140">How automatic recognition happens</text>
  <text class="subtitle" x="90" y="176">A shared-space sensor notices the reset, identifies the participating roommate, and posts appreciation—without a claim step.</text>

  <!-- shared center line: y = 330 -->
  <g filter="url(#shadow)">
    <rect x="90" y="260" width="220" height="140" rx="16" fill="#237568"/>
    <rect x="410" y="260" width="250" height="140" rx="10" fill="#fffdf8" stroke="#237568" stroke-width="3"/>
    <polygon points="790,235 885,330 790,425 695,330" fill="#fffdf8" stroke="#237568" stroke-width="3"/>
    <rect x="1015" y="260" width="320" height="140" rx="10" fill="#fffdf8" stroke="#237568" stroke-width="3"/>
    <rect x="1435" y="260" width="275" height="140" rx="12" fill="#f2c45f" stroke="#d4a62f" stroke-width="3"/>
  </g>

  <path d="M310 330 H390" fill="none" stroke="#718b82" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M660 330 H682" fill="none" stroke="#718b82" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M885 330 H995" fill="none" stroke="#718b82" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1335 330 H1415" fill="none" stroke="#718b82" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="branch" x="930" y="312" text-anchor="middle">YES</text>

  <text class="node-label" x="200" y="300" fill="#f5f1e7">START</text>
  <text class="node-title" x="200" y="338" fill="#ffffff"><tspan x="200">Sink state</tspan><tspan x="200" dy="27">changes</tspan></text>

  <text class="node-label" x="535" y="300">SENSOR</text>
  <text class="node-title" x="535" y="338"><tspan x="535">Persistent change</tspan><tspan x="535" dy="27">detected</tspan></text>

  <text class="node-label" x="790" y="303">DECISION</text>
  <text class="node-title" x="790" y="339"><tspan x="790">Roommate</tspan><tspan x="790" dy="27">cleans?</tspan></text>

  <text class="node-label" x="1175" y="299">SENSOR + IDENTITY</text>
  <text class="node-title" x="1175" y="337"><tspan x="1175">Reset confirmed;</tspan><tspan x="1175" dy="27">Jordan detected</tspan></text>

  <text class="node-label" x="1572.5" y="300" fill="#6b5316">OUTCOME</text>
  <text class="node-title" x="1572.5" y="338"><tspan x="1572.5">Recognition</tspan><tspan x="1572.5" dy="27">posted</tspan></text>

  <path d="M790 425 V474 H915" fill="none" stroke="#8aa096" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="branch" x="804" y="460">NO</text>
  <rect x="935" y="438" width="285" height="90" rx="10" fill="#d7e5de" stroke="#9db2a7" stroke-width="2"/>
  <text class="node-title" x="1077.5" y="475" font-size="18">Alert stays open</text>
  <text class="small" x="1077.5" y="502">The board can remind later.</text>

  <line x1="90" y1="590" x2="1710" y2="590" stroke="#b7c7bc" stroke-width="2"/>
  <g transform="translate(1085,625)">
    <rect width="38" height="24" rx="4" fill="#fffdf8" stroke="#237568" stroke-width="2"/><text class="key" x="48" y="17">Action</text>
    <polygon points="155,0 167,12 155,24 143,12" fill="#fffdf8" stroke="#237568" stroke-width="2"/><text class="key" x="177" y="17">Decision</text>
    <rect x="285" width="38" height="24" rx="4" fill="#237568"/><text class="key" x="333" y="17">Entry</text>
    <rect x="415" width="38" height="24" rx="4" fill="#f2c45f" stroke="#d4a62f" stroke-width="2"/><text class="key" x="463" y="17">Outcome</text>
  </g>
</svg>
